<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Mirror versus oracle</title>
  <desc id="d">Left: a mirror test is written from the same belief as the code, so when the belief is wrong both are wrong and the suite stays green. Right: an oracle takes its expectation from the intent, outside the code, so it fails when the code is wrong.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="760" height="360" rx="12" fill="#ffffff"/>

  <!-- MIRROR -->
  <rect x="20" y="20" width="350" height="320" rx="10" fill="#fff8f0" stroke="#d4a72c"/>
  <text x="40" y="50" font-size="17" font-weight="600" fill="#1f2328">Mirror</text>
  <text x="40" y="70" font-size="12" fill="#57606a">test imports the implementation</text>

  <rect x="110" y="88" width="170" height="44" rx="8" fill="#ffffff" stroke="#d4a72c"/>
  <text x="195" y="108" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">Agent's belief</text>
  <text x="195" y="124" font-size="11" text-anchor="middle" fill="#cf222e">(drifted: no guard needed)</text>

  <line x1="160" y1="132" x2="110" y2="178" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="230" y1="132" x2="280" y2="178" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="182" width="140" height="44" rx="8" fill="#fff1f0" stroke="#cf222e"/>
  <text x="110" y="202" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">src/</text>
  <text x="110" y="218" font-size="11" text-anchor="middle" fill="#cf222e">route without guard</text>

  <rect x="210" y="182" width="140" height="44" rx="8" fill="#fff1f0" stroke="#cf222e"/>
  <text x="280" y="202" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">test</text>
  <text x="280" y="218" font-size="11" text-anchor="middle" fill="#cf222e">imports src/, mocks auth</text>

  <line x1="210" y1="204" x2="182" y2="204" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <rect x="70" y="250" width="250" height="40" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="195" y="275" font-size="14" text-anchor="middle" font-weight="600" fill="#1a7f37">suite green ✓</text>
  <text x="195" y="318" font-size="12" text-anchor="middle" fill="#57606a">Wrong in the same direction. It agrees;</text>
  <text x="195" y="334" font-size="12" text-anchor="middle" fill="#57606a">agreement is not verification.</text>

  <!-- ORACLE -->
  <rect x="390" y="20" width="350" height="320" rx="10" fill="#f0f7ff" stroke="#0969da"/>
  <text x="410" y="50" font-size="17" font-weight="600" fill="#1f2328">Oracle</text>
  <text x="410" y="70" font-size="12" fill="#57606a">expectation from outside the code</text>

  <rect x="400" y="88" width="150" height="44" rx="8" fill="#ffffff" stroke="#0969da"/>
  <text x="475" y="108" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">Intent / contract</text>
  <text x="475" y="124" font-size="11" text-anchor="middle" fill="#1a7f37">mutations need auth</text>

  <rect x="580" y="88" width="150" height="44" rx="8" fill="#ffffff" stroke="#d4a72c"/>
  <text x="655" y="108" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">Agent's belief</text>
  <text x="655" y="124" font-size="11" text-anchor="middle" fill="#cf222e">(drifted)</text>

  <line x1="475" y1="132" x2="475" y2="178" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="655" y1="132" x2="655" y2="178" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="400" y="182" width="150" height="44" rx="8" fill="#ffffff" stroke="#0969da"/>
  <text x="475" y="202" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">oracle/</text>
  <text x="475" y="218" font-size="11" text-anchor="middle" fill="#57606a">POST without a session</text>

  <rect x="580" y="182" width="150" height="44" rx="8" fill="#fff1f0" stroke="#cf222e"/>
  <text x="655" y="202" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">src/</text>
  <text x="655" y="218" font-size="11" text-anchor="middle" fill="#cf222e">route without guard</text>

  <line x1="550" y1="204" x2="578" y2="204" stroke="#0969da" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="565" y="196" font-size="10" text-anchor="middle" fill="#0969da">HTTP</text>

  <rect x="440" y="250" width="250" height="40" rx="8" fill="#fff1f0" stroke="#cf222e"/>
  <text x="565" y="275" font-size="14" text-anchor="middle" font-weight="600" fill="#cf222e">test fails ✗ (correctly)</text>
  <text x="565" y="318" font-size="12" text-anchor="middle" fill="#57606a">Two independent sources disagree,</text>
  <text x="565" y="334" font-size="12" text-anchor="middle" fill="#57606a">so the defect becomes visible.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </radialGradient>

    <!-- Plumb Line Laser Glow -->
    <linearGradient id="laserLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="1" />
    </linearGradient>

    <!-- Brass Body Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="goldMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="goldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Alignment Reticle / Construction Grid Subtle Marks -->
  <g opacity="0.15" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 6">
    <circle cx="256" cy="270" r="160" fill="none" />
    <circle cx="256" cy="270" r="100" fill="none" />
    <line x1="64" y1="270" x2="448" y2="270" />
  </g>

  <!-- Vertical Axis / Plumb Line (True Gravity Line) -->
  <line x1="256" y1="40" x2="256" y2="200" stroke="url(#laserLine)" stroke-width="3" filter="url(#glow)" />
  <line x1="256" y1="40" x2="256" y2="200" stroke="#E0F2FE" stroke-width="1.5" />

  <!-- Target Point / Anchor Ring at the Top -->
  <circle cx="256" cy="188" r="8" fill="#FDE68A" stroke="#B45309" stroke-width="2.5" />
  <circle cx="256" cy="188" r="3" fill="#1E293B" />

  <!-- Plumb Bob Cap (Hexagonal / Machined Brass Collar) -->
  <path d="M 240 200 L 272 200 L 280 216 L 232 216 Z" fill="url(#goldLight)" />
  <rect x="236" y="216" width="40" height="8" rx="2" fill="url(#goldMid)" />

  <!-- Geometric Faceted Plumb Bob Body -->
  <!-- Left Facet (Reflective / Highlighted) -->
  <path d="M 236 224 L 256 224 L 256 384 L 204 260 Z" fill="url(#goldLight)" />

  <!-- Center Facet (Direct Light) -->
  <path d="M 256 224 L 276 224 L 308 260 L 256 384 Z" fill="url(#goldMid)" />

  <!-- Outer Shadow / Depth Facets -->
  <path d="M 204 260 L 236 224 L 216 224 Z" fill="url(#goldShadow)" opacity="0.6" />
  <path d="M 276 224 L 308 260 L 296 224 Z" fill="url(#goldShadow)" opacity="0.8" />

  <!-- Needle Tip / Plumb Pointer (Extreme Precision) -->
  <path d="M 254 384 L 258 384 L 256 412 Z" fill="#FDE68A" filter="url(#glow)" />
  <circle cx="256" cy="414" r="2" fill="#38BDF8" filter="url(#glow)" />

  <!-- Ground Optical Target / Drop Horizon -->
  <ellipse cx="256" cy="436" rx="36" ry="6" fill="#38BDF8" opacity="0.25" filter="url(#glow)" />
  <ellipse cx="256" cy="436" rx="16" ry="2.5" fill="#38BDF8" opacity="0.6" />
</svg>
